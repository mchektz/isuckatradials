<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i suck at radials</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
    transition: background 0.2s, color 0.2s;
}

#statsCorner{
    position:fixed;
    top:10px;
    right:12px;
    font-size:18px;
    text-align:right;
}

canvas{
    width: min(90vw, 500px);
    height: min(90vw, 500px);
    background: transparent;
    border-radius:8px;
    margin-top:40px;
}

.controls{
    margin-top:15px;
}

input{
    width:90px;
    font-size:24px;
    text-align:center;
    padding:8px;
    border-radius:5px;
    border:1px solid;
    outline:none;
    transition: background 0.2s, color 0.2s, border 0.2s;
}

button{
    font-size:18px;
    padding:8px 14px;
    margin-left:6px;
    border-radius:5px;
    cursor:pointer;
    border:1px solid;
    transition: background 0.2s, color 0.2s, border 0.2s;
}

#result{
    height:32px;
    margin-top:12px;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="statsCorner">
    <div id="scoreText">0/0</div>
    <div id="percentText">0%</div>
</div>

<canvas id="canvas"></canvas>

<div class="controls">
    <input id="answer" maxlength="3">
    <button onclick="submit()">submit</button>
    <button onclick="next()">skip</button>
    <button onclick="reset()">reset</button>
</div>

<div id="result"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let correctBearing = 0;
let correct = 0;
let total = 0;

// 36 radials
const angles = Array.from({length:36},(_,i)=>i*10);
let weights = new Array(36).fill(1);

function getTheme(){
    const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    return {
        bg: dark ? "#000" : "#fff",
        fg: dark ? "#fff" : "#000",
        border: dark ? "#555" : "#aaa"
    };
}

function applyTheme(){
    const t = getTheme();

    document.body.style.background = t.bg;
    document.body.style.color = t.fg;

    // remove border completely
    canvas.style.border = "none";

    document.querySelectorAll("input, button").forEach(el=>{
        el.style.background = t.fg;
        el.style.color = t.bg;
        el.style.borderColor = t.border;
    });

    document.getElementById("statsCorner").style.color = t.fg;
}
    document.getElementById("statsCorner").style.color = t.fg;
}

/* ======================= */

function resizeCanvas(){
    const size = Math.min(window.innerWidth * 0.92, 520);

    canvas.width = size;
    canvas.height = size;

    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
applyTheme();

window.matchMedia("(prefers-color-scheme: dark)")
.addEventListener("change", ()=>{
    applyTheme();
    next();
});

function pad3(n){
    return String(n).padStart(3,"0");
}

function pickWeighted(){
    let sum = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*sum;

    for(let i=0;i<weights.length;i++){
        r -= weights[i];
        if(r<=0) return angles[i];
    }
    return angles[0];
}

function draw(angle){

    const theme = getTheme();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const size = canvas.width;
    const cx = size / 2;
    const cy = size / 2;
    const r = size * 0.35;

    // circle
    ctx.strokeStyle = theme.fg;
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // center dot
    ctx.fillStyle = theme.fg;
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();

    // radial line
    const rad = (angle - 90) * Math.PI / 180;
    const x = cx + r * Math.cos(rad);
    const y = cy + r * Math.sin(rad);

    ctx.strokeStyle = "#ff1493";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
}

function updateStats(){
    const pct = total===0 ? 0 : Math.round((correct/total)*100);

    document.getElementById("scoreText").textContent =
        `${correct}/${total}`;

    document.getElementById("percentText").textContent =
        `${pct}%`;
}

function submit(){

    const guess = answer.value.trim();
    if(!/^\d{3}$/.test(guess)) return;

    total++;

    const correctStr = pad3(correctBearing);

    const visualAngle = (correctBearing - 20 + 360) % 360;
    const index = Math.round(visualAngle / 10) % 36;

    if(guess === correctStr){

        correct++;
        weights[index] = Math.max(1, weights[index]-1);

        result.style.color="#00ff66";
        result.textContent="Correct";
    } else {

        weights[index] += 3;

        result.style.color="#ff5555";
        result.textContent="Answer: "+correctStr;
    }

    updateStats();
    setTimeout(next,200);
}

function next(){
    const visual = pickWeighted();
    correctBearing = (visual + 20) % 360;
    draw(visual);

    answer.value="";
    answer.focus();
}

function reset(){
    correct=0;
    total=0;
    weights.fill(1);
    result.textContent="";
    updateStats();
    next();
}

document.getElementById("answer")
.addEventListener("keydown",e=>{
    if(e.key==="Enter") submit();
});

reset();
</script>

</body>
</html>
