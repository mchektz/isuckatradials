<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let correctBearing = 0;

let correct = 0;
let total = 0;

// 36 radials
const angles = Array.from({length:36},(_,i)=>i*10);
let weights = new Array(36).fill(1);

/* =========================
   THEME SYSTEM (NEW)
========================= */

const isDark = window.matchMedia("(prefers-color-scheme: dark)");

function getTheme(){
    return isDark.matches
        ? { bg:"#111", fg:"#fff" }
        : { bg:"#fff", fg:"#000" };
}

function applyThemeBackground(){
    const theme = getTheme();

    canvas.style.background = theme.bg;
    document.body.style.background = theme.bg;
    document.body.style.color = theme.fg;
}

/* ========================= */

function resizeCanvas(){

    const size = Math.min(window.innerWidth * 0.92, 520);

    canvas.width = size;
    canvas.height = size;

    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
applyThemeBackground();

/* live theme switching */
isDark.addEventListener("change", () => {
    applyThemeBackground();
    draw(correctBearing - 20);
});

function pad3(n){
    return String(n).padStart(3,"0");
}

function pickWeighted(){
    let sum = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*sum;

    for(let i=0;i<weights.length;i++){
        r -= weights[i];
        if(r<=0) return angles[i];
    }
    return angles[0];
}

function draw(angle){

    const theme = getTheme();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const size = canvas.width;
    const cx = size / 2;
    const cy = size / 2;
    const r = size * 0.35;

    // circle
    ctx.strokeStyle = theme.fg;
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // center dot
    ctx.fillStyle = theme.fg;
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();

    // radial line
    const rad = (angle - 90) * Math.PI / 180;
    const x = cx + r * Math.cos(rad);
    const y = cy + r * Math.sin(rad);

    ctx.strokeStyle = "#ff1493";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
}

function updateStats(){
    const pct = total===0 ? 0 : Math.round((correct/total)*100);

    document.getElementById("scoreText").textContent =
        `${correct}/${total}`;

    document.getElementById("percentText").textContent =
        `${pct}%`;
}

function submit(){

    const guess = answer.value.trim();
    if(!/^\d{3}$/.test(guess)) return;

    total++;

    const correctStr = pad3(correctBearing);

    const visualAngle = (correctBearing - 20 + 360) % 360;
    const index = Math.round(visualAngle / 10) % 36;

    if(guess === correctStr){

        correct++;
        weights[index] = Math.max(1, weights[index]-1);

        result.style.color="#00ff66";
        result.textContent="Correct";
    } else {

        weights[index] += 3;

        result.style.color="#ff5555";
        result.textContent="Answer: "+correctStr;
    }

    updateStats();
    setTimeout(next,200);
}

function next(){
    const visual = pickWeighted();
    correctBearing = (visual + 20) % 360;
    draw(visual);
    answer.value="";
    answer.focus();
}

function reset(){
    correct=0;
    total=0;
    weights.fill(1);
    result.textContent="";
    updateStats();
    next();
}

document.getElementById("answer")
.addEventListener("keydown",e=>{
    if(e.key==="Enter") submit();
});

reset();
</script>
